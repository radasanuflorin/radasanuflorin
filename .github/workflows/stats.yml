name: stats

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, assets/face.json, .github/workflows/stats.yml]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build stats card (private repos included)
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/build-stats.mjs
      - name: Build terminal card with live numbers
        run: node scripts/build-terminal.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats.json assets/terminal.svg
          git diff --cached --quiet || (git commit -m "chore: update profile cards" && git push)
